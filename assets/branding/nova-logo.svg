<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">NØVA Flash Studio</title>
  <desc id="desc">A bold N monogram with a cyan-to-violet orbital ring on a dark rounded-square field.</desc>
  <defs>
    <linearGradient id="field" x1="128" y1="64" x2="896" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.52" stop-color="#0a0d20"/>
      <stop offset="1" stop-color="#10071f"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientTransform="translate(224 176) rotate(38) scale(560)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2ee8ff" stop-opacity="0.36"/>
      <stop offset="0.46" stop-color="#159bd8" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#159bd8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientTransform="translate(844 884) rotate(-142) scale(610)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#6738d8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#6738d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="280" y1="268" x2="752" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6ef7ff"/>
      <stop offset="0.45" stop-color="#35c9ff"/>
      <stop offset="0.72" stop-color="#7c8cff"/>
      <stop offset="1" stop-color="#b06cff"/>
    </linearGradient>
    <linearGradient id="orbit" x1="214" y1="700" x2="814" y2="318" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#23d8ff" stop-opacity="0.12"/>
      <stop offset="0.42" stop-color="#4ae9ff" stop-opacity="0.92"/>
      <stop offset="0.72" stop-color="#8b7bff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="rim" x1="96" y1="88" x2="930" y2="950" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#68f4ff" stop-opacity="0.52"/>
      <stop offset="0.5" stop-color="#5b8cff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0.42"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0.3 0 0 0 0.05  0 0.8 0 0 0.55  0 1 0 0 0.9  0 0 0 0.85 0" result="tint"/>
      <feMerge>
        <feMergeNode in="tint"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="squircle">
      <rect x="48" y="48" width="928" height="928" rx="218"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect x="48" y="48" width="928" height="928" rx="218" fill="url(#field)"/>
    <rect x="48" y="48" width="928" height="928" fill="url(#cyanGlow)"/>
    <rect x="48" y="48" width="928" height="928" fill="url(#violetGlow)"/>

    <!-- Faint technical grid: present at high resolution, dissolves at icon sizes. -->
    <g opacity="0.12" stroke="#58e7ff" stroke-width="1.2">
      <path d="M-40 316 L1064 316 M-40 512 L1064 512 M-40 708 L1064 708"/>
      <path d="M316 -40 L316 1064 M512 -40 L512 1064 M708 -40 L708 1064"/>
    </g>
    <g opacity="0.16" stroke="#8b7bff" stroke-width="2">
      <path d="M92 800 L800 92"/>
      <path d="M224 944 L944 224"/>
    </g>

    <!-- Orbit and accent nodes. -->
    <ellipse cx="512" cy="514" rx="318" ry="236" transform="rotate(-31 512 514)"
             fill="none" stroke="url(#orbit)" stroke-width="9"/>
    <circle cx="762" cy="292" r="20" fill="#a78bfa" filter="url(#softGlow)"/>
    <circle cx="762" cy="292" r="8" fill="#e7e1ff"/>
    <circle cx="270" cy="742" r="10" fill="#55ebff" filter="url(#softGlow)"/>

    <!-- Bold N monogram. -->
    <path d="M300 742 V282 L724 742 V282"
          fill="none" stroke="url(#mark)" stroke-width="92"
          stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

    <!-- A precise inner highlight keeps the mark crisp on small icons. -->
    <path d="M300 742 V282 L724 742 V282"
          fill="none" stroke="#e9fbff" stroke-opacity="0.28" stroke-width="10"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Rim and inner keyline. -->
  <rect x="48" y="48" width="928" height="928" rx="218" fill="none" stroke="url(#rim)" stroke-width="5"/>
  <rect x="72" y="72" width="880" height="880" rx="196" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="2"/>
</svg>
